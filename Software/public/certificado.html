<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado de Inducción</title>

    <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/style1.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/certificado.css">
</head>

<body data-pagina="certificado">

    <!-- SIDEBAR DINÁMICO -->
    <div id="sidebarContainer"></div>

    <!-- OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- NAVBAR -->
    <nav class="navbar-custom">

        <div class="navbar-left">

            <i class="fas fa-bars menu-toggle"
               id="btnOpenSidebar"></i>

            <i class="fas fa-certificate"></i>

            <span class="section-main-title">
                Certificado de Inducción
            </span>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <main class="certificado-main">

        <div class="certificado-wrapper">

            <div
                class="certificado-card"
                id="certificadoCard">

                <div class="marca-agua">
                    PROCESADOS MARGARITA SAS
                </div>

                <!-- LOADING -->

                <div
                    id="loadingCertificado"
                    class="loading-spinner text-center py-5">

                    <div class="spinner-border text-success"></div>

                    <p>
                        Cargando certificado...
                    </p>

                </div>

                <!-- CERTIFICADO -->

                <div
                    id="contenidoCertificado"
                    style="display:none;">

                    <div class="certificado-contenido">

                        <div class="certificado-marco">

                            <div class="certificado-header">

                                <img
                                    src="img/Logo.png"
                                    class="certificado-logo">

                                <div class="certificado-titulo">

                                    <h1>
                                        CERTIFICADO DE INDUCCIÓN
                                    </h1>

                                    <p>
                                        Plan de Inducción Obligatoria
                                    </p>

                                </div>

                            </div>

                            <div class="certificado-cuerpo">

                                <p class="fw-bold">
                                    LA EMPRESA PROCESADOS MARGARITA SAS CERTIFICA A
                                </p>

                                <div
                                    id="nombreEmpleado"
                                    class="certificado-nombre">
                                </div>

                                <div id="documentoEmpleado"></div>

                                <p>
                                    Ha completado el plan de inducción con éxito.
                                </p>

                                <p>
                                    Nota promedio:
                                    <strong id="notaPromedio"></strong>%
                                </p>

                                <div id="fechaCertificado"></div>

                            </div>

                            <!-- FIRMAS -->

                            <div class="certificado-firma">

                                <div class="firma-area">

                                    <div id="firmaEmpleado"></div>

                                    <div class="firma-linea"></div>

                                    <div id="nombreEmpleadoFirma"></div>

                                    <div>Empleado</div>

                                </div>

                                <div class="firma-area">

                                    <img
                                        src="img/firma.png"
                                        class="firma-img">

                                    <div class="firma-linea"></div>

                                    <div>
                                        Director administrativo
                                    </div>

                                </div>

                                <div class="firma-area">

                                    <img
                                        src="img/sello.png"
                                        class="firma-img">

                                    <div class="firma-linea"></div>

                                    <div>
                                        Sello Empresarial
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- SIDEBAR -->
    <script src="/js/sidebar.js"></script>

    <!-- CERTIFICADO -->
    <script src="js/certificado.js"></script>

</body>
</html>
