<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear Usuario ERP</title>

<!-- FUENTE -->
<link href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap" rel="stylesheet">

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- ESTILOS -->
<link rel="stylesheet" href="/css/style1.css">
<link rel="stylesheet" href="/css/crear-usuario.css">

<link rel="icon" href="/img/Gemini_Generated_Image_bo9w5fbo9w5fbo9w-removebg-preview.png">

</head>

<body>

<!-- =========================================
     🔥 NAVBAR
========================================= -->

<nav class="navbar-custom">

    <div class="navbar-left">

        <img
            src="/img/logo de procesados solo.png"
            class="logo-navbar"
        >

        <span class="empresa-nombre">
            Procesados Margarita SAS
        </span>

    </div>

    <div class="acciones-navbar">

        <a
            href="/usuarios"
            class="btn btn-light"
        >

            <i class="fas fa-arrow-left"></i>

            Volver

        </a>

        <a
            href="/logout"
            class="btn-logout"
        >

            <i class="fas fa-power-off"></i>

            Cerrar sesión

        </a>

    </div>

</nav>

<!-- =========================================
     🔥 CONTENIDO
========================================= -->

<div class="crear-usuario-container">

    <div class="card-crear-usuario">

        <!-- ICONO -->

        <div class="icono-superior">

            <i class="fas fa-user-shield"></i>

        </div>

        <!-- TITULO -->

        <h2>
            Crear Usuario ERP
        </h2>

        <p class="subtitulo">

            Configuración inicial de acceso al sistema

        </p>

        <!-- ALERTA -->

        <div id="mensaje"></div>

        <!-- =====================================
             🔥 FORM
        ====================================== -->

        <form id="formCrearUsuario">

            <div class="row">

                <!-- =====================================
                     🔥 EMPLEADO
                ====================================== -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        <i class="fas fa-users"></i>

                        Empleado

                    </label>

                    <div class="buscador-container">

                        <input
                            type="text"
                            id="buscarEmpleado"
                            class="form-control"
                            placeholder="Buscar empleado..."
                            autocomplete="off"
                        >

                        <input
                            type="hidden"
                            id="empleado"
                        >

                        <!-- RESULTADOS -->

                        <div
                            id="listaEmpleados"
                            class="lista-empleados"
                        ></div>

                    </div>

                </div>

                <!-- =====================================
                     🔥 ROL
                ====================================== -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        <i class="fas fa-user-lock"></i>

                        Rol del sistema

                    </label>

                    <select
                        id="rol"
                        class="form-select"
                        required
                    >

                        <option value="">

                            Seleccione rol

                        </option>

                    </select>

                </div>

                <!-- =====================================
                     🔥 USUARIO
                ====================================== -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        <i class="fas fa-id-card"></i>

                        Usuario

                    </label>

                    <input
                        type="text"
                        id="usuario"
                        class="form-control"
                        readonly
                    >

                    <small class="text-muted">

                        Se genera automáticamente con el documento

                    </small>

                </div>

                <!-- =====================================
                     🔥 PASSWORD
                ====================================== -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        <i class="fas fa-key"></i>

                        Contraseña temporal

                    </label>

                    <div class="input-password">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Ingrese contraseña temporal"
                            required
                        >

                        <i
                            class="fas fa-eye toggle-password"
                            id="togglePassword"
                        ></i>

                    </div>

                </div>

            </div>

            <!-- =====================================
                 🔥 CONFIG
            ====================================== -->

            <div class="config-box">

                <h5>

                    <i class="fas fa-sliders-h"></i>

                    Configuración inicial

                </h5>

                <div class="checks-config">

                    <!-- PRIMERA VEZ -->

                    <label class="check-card">

                        <input
                            type="checkbox"
                            id="primeraVez"
                            checked
                        >

                        <span>
                            Primera vez
                        </span>

                    </label>

                    <!-- CAMBIO PASSWORD -->

                    <label class="check-card">

                        <input
                            type="checkbox"
                            id="cambioPassword"
                            checked
                        >

                        <span>
                            Requiere cambio contraseña
                        </span>

                    </label>

                    <!-- BLOQUEADO -->

                    <label class="check-card">

                        <input
                            type="checkbox"
                            id="bloqueado"
                        >

                        <span>
                            Usuario bloqueado
                        </span>

                    </label>

                </div>

            </div>

            <!-- BOTON -->

            <div class="text-center mt-5">

                <button
                    type="submit"
                    class="btn-crear-usuario"
                >

                    <i class="fas fa-user-plus"></i>

                    Crear Usuario

                </button>

            </div>

        </form>

    </div>

</div>

<!-- =========================================
     🔥 SCRIPT
========================================= -->

<script src="/js/crear-usuario.js"></script>

</body>
</html>
