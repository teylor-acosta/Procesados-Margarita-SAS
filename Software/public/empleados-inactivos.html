<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Empleados Inactivos
    </title>

    <!-- FUENTES -->
    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
        rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- ESTILOS -->
    <link
        rel="stylesheet"
        href="/css/style1.css">

    <link
        rel="stylesheet"
        href="/css/sidebar.css">

    <link
        rel="stylesheet"
        href="/css/empleados-inactivos.css">

</head>

<body data-pagina="empleados-inactivos">

    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <div id="sidebarContainer"></div>

    <!-- =====================================
         OVERLAY
    ====================================== -->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay">
    </div>

    <!-- =====================================
         CONTENIDO PRINCIPAL
    ====================================== -->

    <main class="main-content">

        <!-- =====================================
             NAVBAR
        ====================================== -->

        <nav class="navbar-custom">

            <div class="navbar-left">

                <i
    class="fas fa-bars menu-toggle"
    id="btnOpenSidebar">
</i>

                <span class="empresa-nombre">
                    Empleados Inactivos
                </span>

            </div>

        </nav>

        <!-- =====================================
             CONTENEDOR
        ====================================== -->

        <div class="empleados-container">

            <!-- =====================================
                 HEADER
            ====================================== -->

            <div class="header-dashboard">

                <div class="header-info">

                    <div class="header-icono">

                        <i class="fas fa-user-slash"></i>

                    </div>

                    <div>

                        <h1 class="titulo-dashboard">

                            Empleados Inactivos

                        </h1>

                        <p class="subtitulo-dashboard">

                            Historial de empleados retirados,
                            suspendidos o desactivados del ERP.

                        </p>

                    </div>

                </div>

                <div class="card-stat">

                    <span
                        class="stat-numero"
                        id="totalInactivos">

                        0

                    </span>

                    <span class="stat-label">

                        Inactivos

                    </span>

                </div>

            </div>
                        <!-- =====================================
                 TARJETAS RESUMEN
            ====================================== -->

            <div class="stats-container">

                <div class="stat-card">

                    <div class="stat-icon verde">

                        <i class="fas fa-user-slash"></i>

                    </div>

                    <h3 id="statTotal">

                        0

                    </h3>

                    <span>

                        Inactivos

                    </span>

                </div>

                <div class="stat-card">

                    <div class="stat-icon azul">

                        <i class="fas fa-file-signature"></i>

                    </div>

                    <h3 id="statRenuncias">

                        0

                    </h3>

                    <span>

                        Renuncias

                    </span>

                </div>

                <div class="stat-card">

                    <div class="stat-icon rojo">

                        <i class="fas fa-user-times"></i>

                    </div>

                    <h3 id="statDespidos">

                        0

                    </h3>

                    <span>

                        Despidos

                    </span>

                </div>

                <div class="stat-card">

                    <div class="stat-icon naranja">

                        <i class="fas fa-folder-minus"></i>

                    </div>

                    <h3 id="statOtros">

                        0

                    </h3>

                    <span>

                        Otros Motivos

                    </span>

                </div>

            </div>

            <!-- =====================================
                 FILTROS
            ====================================== -->

            <div class="filtros-barra">

                <div class="filtro-group">

                    <i class="fas fa-search"></i>

                    <input
                        type="text"
                        id="buscador"
                        class="form-control input-busqueda"
                        placeholder="Buscar empleado...">

                </div>

                <div class="filtro-group">

                    <i class="fas fa-building"></i>

                    <select
                        id="filtroArea"
                        class="form-control filtro">

                        <option value="">
                            Todas las áreas
                        </option>

                    </select>

                </div>

                <div class="filtro-group">

                    <i class="fas fa-map-marker-alt"></i>

                    <select
                        id="filtroSede"
                        class="form-control filtro">

                        <option value="">
                            Todas las sedes
                        </option>

                    </select>

                </div>

                <div class="filtro-group">

                    <i class="fas fa-briefcase"></i>

                    <select
                        id="filtroCargo"
                        class="form-control filtro">

                        <option value="">
                            Todos los cargos
                        </option>

                    </select>

                </div>

                <button
                    id="btnLimpiar"
                    class="btn-limpiar">

                    <i class="fas fa-broom"></i>

                </button>

            </div>

            <!-- =====================================
                 TABLA
            ====================================== -->

            <div class="tabla-container">

                <div class="table-responsive">

                    <table class="tabla-corporativa">

                        <thead>

    <tr>

        <th>Código</th>

        <th>Empleado</th>

        <th>Cargo</th>

        <th>Fecha Registro</th>

        <th>Fecha Baja</th>

        <th>Motivo</th>

        <th>Usuario ERP</th>

        <th>Estado</th>

        <th>Acciones</th>

    </tr>

</thead>

                        <tbody id="tablaInactivos">

                        </tbody>

                    </table>

                </div>

            </div>
                        <!-- =====================================
                 MODAL DETALLE EMPLEADO
            ====================================== -->

            <div
                class="modal fade"
                id="modalDetalleEmpleado"
                tabindex="-1">

                <div class="modal-dialog modal-lg">

                    <div class="modal-content">

                        <div class="modal-header">

                            <h5 class="modal-title">

                                <i class="fas fa-user-slash"></i>

                                Detalle Empleado Inactivo

                            </h5>

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                            </button>

                        </div>

                        <div class="modal-body">

                            <div class="row g-4">

                                <div class="col-md-6">

                                    <label class="fw-bold">
                                        Empleado
                                    </label>

                                    <div
                                        id="detalleNombre"
                                        class="valor-detalle">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="fw-bold">
                                        Documento
                                    </label>

                                    <div
                                        id="detalleDocumento"
                                        class="valor-detalle">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="fw-bold">
                                        Fecha Desactivación
                                    </label>

                                    <div
                                        id="detalleFecha"
                                        class="valor-detalle">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="fw-bold">
                                        Motivo
                                    </label>

                                    <div
                                        id="detalleMotivo"
                                        class="valor-detalle">
                                    </div>

                                </div>

                                <div class="col-md-12">

                                    <label class="fw-bold">
                                        Observación
                                    </label>

                                    <div
                                        id="detalleObservacion"
                                        class="valor-detalle">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="fw-bold">
                                        Usuario ERP
                                    </label>

                                    <div
                                        id="detalleUsuario"
                                        class="valor-detalle">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="fw-bold">
                                        Estado Usuario
                                    </label>

                                    <div
                                        id="detalleEstado"
                                        class="valor-detalle">
                                    </div>

                                </div>

                            </div>

                        </div>

                        <div class="modal-footer">

                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">

                                Cerrar

                            </button>

                            <button
                                type="button"
                                id="btnReactivarModal"
                                class="btn btn-success">

                                <i class="fas fa-user-check"></i>

                                Reactivar

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- =====================================
         BOOTSTRAP
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- =====================================
         SWEETALERT
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <script src="/js/sidebar.js"></script>

    <!-- =====================================
         MODULO
    ====================================== -->

    <script src="/js/empleados-inactivos.js"></script>

</body>

</html>
