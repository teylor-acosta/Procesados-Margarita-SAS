<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inducción - Procesados Margarita</title>
    
    <!-- Fuentes Corporativas -->
    <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- CDNs Estilos (Bootstrap 5.3.3 & FontAwesome 6) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="img/Gemini_Generated_Image_bo9w5fbo9w5fbo9w-removebg-preview.png">
    
    <!-- Hojas de Estilo ERP -->
    <link rel="stylesheet" href="css/style1.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/induccion.css">
</head>
<body data-pagina="induccion">

    <!-- SIDEBAR DINÁMICO -->
    <div id="sidebarContainer"></div>

    <!-- Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- NAVBAR -->
    <nav class="navbar-custom">

        <div class="navbar-left" style="display:flex; align-items:center; gap:10px;">

            <i class="fas fa-bars menu-toggle"
               id="btnOpenSidebar"
               style="cursor:pointer; color:#2f3542;">
            </i>

            <img src="/img/Logo.png"
                 class="logo-navbar"
                 alt="Logo">

            <span class="section-main-title"
                  style="font-weight:600; color:#2f3542;">

                Procesados Margarita SAS

            </span>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <main class="dashboard-container">

        <div class="background-overlay content">

            <div class="container py-4">

                <div class="text-center mb-5">

                    <h1 class="titulo-principal"
                        id="user-welcome-title">

                        Plan de Inducción Obligatoria

                    </h1>

                    <p class="subtitulo-principal text-muted">

                        Visualiza los videos para habilitar tus evaluaciones.

                    </p>

                </div>

                <div class="row justify-content-center">

                    <div class="col-md-10"
                         id="contenedorCapitulos">

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- MODAL VIDEO -->

    <div class="modal fade"
         id="videoModal"
         tabindex="-1"
         aria-hidden="true"
         data-bs-backdrop="static"
         data-bs-keyboard="false">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content border-0 shadow-lg"
                 style="border-radius:15px; overflow:hidden;">

                <div class="modal-header bg-dark text-white border-0">

                    <h5 class="modal-title">

                        <i class="fas fa-video text-success me-2"></i>

                        Capacitación Institucional - SST

                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body p-0 bg-dark">

                    <div class="ratio ratio-16x9">

                        <video id="videoPlayer"
                               controls
                               controlsList="nodownload">

                            <source id="videoSource"
                                    src=""
                                    type="video/mp4">

                        </video>

                    </div>

                </div>

                <div class="modal-footer bg-light border-0">

                    <button class="btn btn-confirmar w-100 py-3 fw-bold"
                            id="btnConfirmarVisto"
                            disabled>

                        Debe visualizar el video instructivo completo

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/auth.js"></script>

    <script src="/js/sidebar.js"></script>

    <script src="js/induccion.js"></script>

</body>
</html>
