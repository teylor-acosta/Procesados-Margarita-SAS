<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>

    Capacitaciones - Procesados Margarita

</title>

<link
    href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    rel="stylesheet"
    href="/css/style1.css"
>

<link
    rel="stylesheet"
    href="/css/capacitaciones.css"
>

</head>

<body>

<!-- =========================================
NAVBAR
========================================= -->

<nav class="navbar-custom">

    <div class="navbar-left">

        <img
            src="/img/Logo.png"
            class="logo-navbar"
        >

        <span class="empresa-nombre">

            Procesados Margarita SAS

        </span>

    </div>

    <div class="acciones-navbar">

        <button
            class="btn btn-light"
            onclick="window.location.href='/recursos-humanos'"
        >

            <i class="fas fa-arrow-left"></i>

            Volver

        </button>

        <a
            href="/logout"
            class="btn-logout"
        >

            <i class="fas fa-power-off"></i>

            Cerrar sesión

        </a>

    </div>

</nav>

<!-- =========================================
CONTENIDO
========================================= -->

<div class="capacitaciones-dashboard">

    <!-- TITULO -->

    <div class="cabecera-capacitaciones">

        <h1>

            <i class="fas fa-graduation-cap"></i>

            Centro de Capacitaciones

        </h1>

        <p>

            Seguimiento de inducciones,
            capacitaciones, evaluaciones
            y certificados.

        </p>

    </div>

    <!-- TARJETAS -->

    <div class="estadisticas-grid">

        <div class="card-estadistica completadas">

            <i class="fas fa-circle-check"></i>

            <h2 id="totalCompletadas">

                0

            </h2>

            <span>

                Completadas

            </span>

        </div>

        <div class="card-estadistica proceso">

            <i class="fas fa-spinner"></i>

            <h2 id="totalProceso">

                0

            </h2>

            <span>

                En Proceso

            </span>

        </div>

        <div class="card-estadistica pendientes">

            <i class="fas fa-clock"></i>

            <h2 id="totalPendientes">

                0

            </h2>

            <span>

                Sin Iniciar

            </span>

        </div>

        <div class="card-estadistica certificados">

            <i class="fas fa-file-certificate"></i>

            <h2 id="totalCertificados">

                0

            </h2>

            <span>

                Certificados

            </span>

        </div>

    </div>

    <!-- TABLA -->

<div class="contenedor-tabla">

    <div class="barra-superior">

        <input
            type="text"
            id="buscador"
            class="form-control"
            placeholder="Buscar empleado..."
        >

        <button
            id="btnExcel"
            class="btn-exportar"
        >

            <i class="fas fa-file-excel"></i>

            Exportar Excel

        </button>

    </div>

    <div class="filtros-capacitacion">

        <button
            class="btn-filtro activo"
            data-filtro="todos"
        >
            Todos
        </button>

        <button
            class="btn-filtro"
            data-filtro="completada"
        >
            Completadas
        </button>

        <button
            class="btn-filtro"
            data-filtro="proceso"
        >
            En Proceso
        </button>

        <button
            class="btn-filtro"
            data-filtro="pendiente"
        >
            Sin Iniciar
        </button>

        <button
            class="btn-filtro"
            data-filtro="certificado"
        >
            Con Certificado
        </button>

        <button
            class="btn-filtro"
            data-filtro="sin-certificado"
        >
            Sin Certificado
        </button>

    </div>

    <div class="table-responsive">

        <table class="table">

            <thead>

                <tr>

                    <th>Código</th>

                    <th>Empleado</th>

                    <th>Usuario</th>

                    <th>Progreso</th>

                    <th>Evaluación</th>

                    <th>Certificado</th>

                    <th>Estado</th>

                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody
                id="tablaSeguimiento"
            >

            </tbody>

        </table>

        <div
            id="contenedorPaginacion"
            class="contenedor-paginacion"
        >
        </div>

    </div>

</div>
<div
    class="modal fade"
    id="modalDetalle"
    tabindex="-1"
>

    <div
        class="modal-dialog modal-lg"
    >

        <div
            class="modal-content"
        >

            <div
                class="modal-header"
            >

                <h5
                    class="modal-title"
                >

                    Detalle de Capacitación

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div
                class="modal-body"
                id="contenidoDetalle"
            >

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/capacitaciones.js"></script>

</body>

</html>
