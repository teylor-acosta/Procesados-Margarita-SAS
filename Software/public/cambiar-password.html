<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cambiar Contraseña - Procesados Margarita
    </title>

    <!-- FUENTES -->
    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
        rel="stylesheet"
    >

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ICONOS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- ESTILOS -->
    <link
        rel="stylesheet"
        href="/css/style1.css"
    >

    <link
        rel="stylesheet"
        href="/css/cambiar-password.css"
    >

    <!-- ICON -->
    <link
        rel="icon"
        href="/img/Gemini_Generated_Image_bo9w5fbo9w5fbo9w-removebg-preview.png"
    >

</head>

<body class="cambiar-password-body">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <!-- 🔥 CARD -->
                <div class="card-cambiar-password">

                    <!-- LOGO -->
                    <div class="text-center">

                        <img
                            src="/img/Logo.png"
                            class="logo-cambiar"
                        >

                        <h3>
                            Cambio de Contraseña
                        </h3>

                        <p class="subtexto-cambiar">

                            Por seguridad debes actualizar tu contraseña

                        </p>

                    </div>

                    <!-- FORM -->
                    <form id="formPassword">

                        <!-- PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label">

                                Nueva contraseña

                            </label>

                            <div class="input-password">

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Ingrese nueva contraseña"
                                    required
                                >

                                <i
                                    class="fas fa-eye toggle-password"
                                    data-target="password"
                                ></i>

                            </div>

                        </div>

                        <!-- CONFIRM -->
                        <div class="mb-4">

                            <label class="form-label">

                                Confirmar contraseña

                            </label>

                            <div class="input-password">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirme nueva contraseña"
                                    required
                                >

                                <i
                                    class="fas fa-eye toggle-password"
                                    data-target="confirmPassword"
                                ></i>

                            </div>

                        </div>

                        <!-- BOTON -->
                        <button
                            type="submit"
                            class="btn-cambiar-password"
                        >

                            <i class="fas fa-save me-2"></i>

                            Guardar contraseña

                        </button>

                        <!-- MENSAJE -->
                        <div
                            id="mensaje"
                            class="mensaje-cambiar"
                            style="display:none;"
                        ></div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="/js/reset-password.js"></script>

</body>
</html>
