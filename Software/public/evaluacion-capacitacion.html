<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Evaluación de capacitación</title>


    <!-- ==========================================
         FUENTE INSTITUCIONAL
    =========================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================
         BOOTSTRAP
    =========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==========================================
         ESTILOS DE LA EVALUACIÓN
    =========================================== -->

    <link
        rel="stylesheet"
        href="/css/evaluacion-capacitacion.css"
    >

</head>


<body>

    <main class="evaluacion-page">

        <div class="evaluacion-contenedor">

            <!-- ENCABEZADO -->

            <section class="encabezado-evaluacion">

                <span class="etiqueta-evaluacion">

                    <i class="fas fa-clipboard-check"></i>

                    Evaluación de capacitación

                </span>

                <h1 id="tituloEvaluacion">
                    Cargando evaluación...
                </h1>

                <p id="descripcionEvaluacion">
                    Preparando la evaluación.
                </p>

                <div class="info-evaluacion">

                    <div class="dato-evaluacion">

                        <i class="fas fa-list-check"></i>

                        <div>

                            <span>
                                Preguntas
                            </span>

                            <strong id="totalPreguntas">
                                0
                            </strong>

                        </div>

                    </div>


                    <div class="dato-evaluacion">

                        <i class="fas fa-bullseye"></i>

                        <div>

                            <span>
                                Aprobación
                            </span>

                            <strong id="porcentajeAprobacion">
                                0%
                            </strong>

                        </div>

                    </div>

                </div>

            </section>


            <!-- PROGRESO -->

            <section class="progreso-evaluacion">

                <div class="progreso-header">

                    <span>
                        Progreso
                    </span>

                    <strong id="progresoTexto">
                        0%
                    </strong>

                </div>

                <div class="progress">

                    <div
                        id="barraProgresoEvaluacion"
                        class="progress-bar"
                        style="width:0%">
                    </div>

                </div>

            </section>


            <!-- PREGUNTAS -->

            <section
                id="contenedorEvaluacion"
                class="contenedor-preguntas"
            >

                <div class="estado-cargando">

                    <i class="fas fa-spinner fa-spin"></i>

                    <h3>
                        Cargando evaluación...
                    </h3>

                    <p>
                        Preparando las preguntas.
                    </p>

                </div>

            </section>


            <!-- BOTÓN -->

            <section class="finalizar-evaluacion">

                <button
                    type="button"
                    id="btnEnviarEvaluacion"
                    class="btn-enviar-evaluacion"
                    disabled
                >

                    <i class="fas fa-paper-plane"></i>

                    Enviar evaluación

                </button>

            </section>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/evaluacion-capacitacion.js"> </script>

</body>

</html>
