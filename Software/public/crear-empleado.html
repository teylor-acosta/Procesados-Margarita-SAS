<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Crear / Editar Empleado</title>

<!-- =========================================
🔥 FUENTE ERP
========================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@400;700&display=swap"
rel="stylesheet">

<!-- =========================================
🔥 BOOTSTRAP
========================================= -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
/>

<!-- =========================================
🔥 ICONOS
========================================= -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<!-- =========================================
🔥 SWEET ALERT
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- =========================================
🔥 ESTILOS ERP
========================================= -->

<link
rel="stylesheet"
href="/css/style1.css"
/>

<link
rel="stylesheet"
href="/css/sidebar.css"
/>

<link
rel="stylesheet"
href="/css/crear-empleado.css"
/>

<link
rel="icon"
href="/img/Logo.png"
/>

</head>

<body data-pagina="crear-empleado">

    <!-- SIDEBAR -->
<div id="sidebarContainer"></div>

<!-- OVERLAY -->
<div
    class="sidebar-overlay"
    id="sidebarOverlay">
</div>

<!-- =========================================
🔥 NAVBAR CORPORATIVO
========================================= -->

<nav class="navbar-custom">

    <div class="navbar-left">

        <i
            class="fas fa-bars menu-toggle"
            id="btnOpenSidebar">
        </i>

        <span class="section-main-title">

            Crear Empleado

        </span>

    </div>

</nav>

<!-- =========================================
🔥 CONTENEDOR PRINCIPAL
========================================= -->

<div class="crear-container">

    <div class="form-card">

        <!-- =====================================
        🔥 HEADER
        ====================================== -->

        <div class="header-formulario">

            <div class="avatar-empleado">

                <i class="fas fa-user"></i>

            </div>

            <div>

                <h1 class="titulo-form">

                    Registro de empleado

                </h1>

                <p class="subtitulo-form">

                    Gestiona la información personal
                    y organizacional del empleado.

                </p>

            </div>

        </div>

        <!-- =====================================
        🔥 FORMULARIO
        ====================================== -->

        <form id="formEmpleado">

            <input
            type="hidden"
            id="empleado_id"
            name="id"
            />

            <!-- =================================
            🔥 INFORMACION PERSONAL
            ================================== -->

            <div class="seccion-form">

                <div class="titulo-seccion">

                    <i class="fas fa-user"></i>

                    Información personal

                </div>

                <div class="row g-4">

                    <div class="col-md-6">

                        <label>Nombres</label>

                        <input
                        type="text"
                        id="nombres"
                        name="nombres"
                        class="form-control"
                        placeholder="Ingrese nombres"
                        />

                    </div>

                    <div class="col-md-6">

                        <label>Apellidos</label>

                        <input
                        type="text"
                        id="apellidos"
                        name="apellidos"
                        class="form-control"
                        placeholder="Ingrese apellidos"
                        />

                    </div>

                    <div class="col-md-6">

                        <label>Tipo documento</label>

                        <select
                        id="tipo_documento"
                        name="tipo_documento"
                        class="form-control"
                        >

                            <option value="">

                                Seleccione

                            </option>

                            <option value="CC">

                                Cédula ciudadanía

                            </option>

                            <option value="TI">

                                Tarjeta identidad

                            </option>

                            <option value="CE">

                                Cédula extranjería

                            </option>

                            <option value="PAS">

                                Pasaporte

                            </option>

                            <option value="PPT">

                                PPT

                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label>Número documento</label>

                        <input
                        type="text"
                        id="numero_documento"
                        name="numero_documento"
                        class="form-control"
                        placeholder="Ingrese documento"
                        />

                    </div>

                    <div class="col-md-4">

                        <label>Fecha nacimiento</label>

                        <input
                        type="date"
                        id="fecha_nacimiento"
                        name="fecha_nacimiento"
                        class="form-control"
                        />

                    </div>

                    <div class="col-md-4">

                        <label>Lugar nacimiento</label>

                        <input
                        type="text"
                        id="lugar_nacimiento"
                        name="lugar_nacimiento"
                        class="form-control"
                        placeholder="Ciudad nacimiento"
                        />

                    </div>

                    <div class="col-md-4">

                        <label>RH</label>

                        <input
                        type="text"
                        id="rh"
                        name="rh"
                        class="form-control"
                        placeholder="O+"
                        />

                    </div>

                    <div class="col-md-4">

                        <label>Estado civil</label>

                        <input
                        type="text"
                        id="estado_civil"
                        name="estado_civil"
                        class="form-control"
                        placeholder="Estado civil"
                        />

                    </div>

                </div>

            </div>

            <!-- =================================
            🔥 CONTACTO
            ================================== -->

            <div class="seccion-form">

                <div class="titulo-seccion">

                    <i class="fas fa-address-book"></i>

                    Información de contacto

                </div>

                <div class="row g-4">

                    <div class="col-md-4">

                        <label>Dirección</label>

                        <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        class="form-control"
                        placeholder="Dirección residencia"
                        />

                    </div>

                    <div class="col-md-4">

                        <label>Barrio</label>

                        <input
                        type="text"
                        id="barrio_localidad"
                        name="barrio_localidad"
                        class="form-control"
                        placeholder="Barrio"
                        />

                    </div>

                    <div class="col-md-4">

                        <label>Teléfono</label>

                        <input
                        type="text"
                        id="telefono"
                        name="telefono"
                        class="form-control"
                        placeholder="Número celular"
                        />

                    </div>

                    <div class="col-md-6">

                        <label>Email</label>

                        <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="correo@empresa.com"
                        />

                    </div>

                </div>

            </div>

            <!-- =================================
            🔥 EMPRESA
            ================================== -->

            <div class="seccion-form">

                <div class="titulo-seccion">

                    <i class="fas fa-building"></i>

                    Información empresarial

                </div>

                <div class="row g-4">

                    <div class="col-md-4">

                        <label>Área</label>

                        <select
                        id="area"
                        name="area_id"
                        class="form-control"
                        >

                            <option value="">

                                Seleccione

                            </option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label>Sede</label>

                        <select
                        id="sede"
                        name="sede_id"
                        class="form-control"
                        >

                            <option value="">

                                Seleccione

                            </option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <label>Cargo</label>

                        <select
                        id="cargo"
                        name="cargo_id"
                        class="form-control"
                        >

                            <option value="">

                                Seleccione

                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- =================================
            🔥 BOTON
            ================================== -->

            <div class="contenedor-boton">

                <button
                type="submit"
                class="btn-guardar"
                >

                    <i class="fas fa-floppy-disk"></i>

                    Guardar empleado

                </button>

            </div>

        </form>

    </div>

</div>

<!-- =========================================
🔥 JS
========================================= -->

<script src="/js/crear-empleado.js"></script>
<script src="/js/sidebar.js"></script>

</body>

</html>
