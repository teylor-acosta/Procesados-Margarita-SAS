
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Felicitación de cumpleaños</title>
</head>

<body style="
    margin:0;
    padding:0;
    background-color:#edf3f6;
    font-family:Arial,Helvetica,sans-serif;
    color:#17324d;
">

    <!-- CONTENEDOR PRINCIPAL -->

    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="background-color:#edf3f6;"
    >
        <tr>
            <td align="center" style="padding:24px 12px;">

                <table
                    role="presentation"
                    width="760"
                    cellspacing="0"
                    cellpadding="0"
                    border="0"
                    style="
                        width:100%;
                        max-width:760px;
                        background-color:#ffffff;
                        border-radius:16px;
                        overflow:hidden;
                    "
                >

                    <!-- ENCABEZADO CORPORATIVO -->

                    <tr>
                        <td
                            align="center"
                            style="
                                background-color:#082e50;
                                padding:22px 18px;
                                color:#ffffff;
                            "
                        >
                            <h1 style="
                                margin:0;
                                font-size:21px;
                                line-height:1.5;
                            ">
                                {{EMPRESA}}
                            </h1>

                            <p style="
                                margin:8px 0 0;
                                font-size:13px;
                                color:#d5e9f4;
                            ">
                                Grandes personas hacen
                                un mejor mañana
                            </p>
                        </td>
                    </tr>

                    <!-- TARJETA PERSONALIZADA -->

                    <tr>
                        <td
                            align="center"
                            style="padding:0;"
                        >
                            <img
                                src="cid:tarjeta-cumpleanos"
                                alt="Feliz cumpleaños, {{NOMBRE}}"
                                width="760"
                                style="
                                    display:block;
                                    width:100%;
                                    max-width:760px;
                                    height:auto;
                                    border:0;
                                    outline:none;
                                    text-decoration:none;
                                "
                            >
                        </td>
                    </tr>

                    <!-- MENSAJE PERSONALIZADO -->

                    <tr>
                        <td style="
                            padding:30px 28px;
                            text-align:center;
                        ">

                            <h2 style="
                                margin:0 0 18px;
                                font-size:23px;
                                color:#08783e;
                            ">
                                ¡Feliz cumpleaños,
                                {{NOMBRE}}!
                            </h2>

                            <div style="
                                font-size:15px;
                                line-height:1.8;
                                color:#425466;
                            ">
                                {{MENSAJE}}
                            </div>

                            <p style="
                                margin:24px 0 0;
                                font-size:14px;
                                font-weight:bold;
                                color:#082e50;
                            ">
                                Con los mejores deseos de
                                {{MASCOTA}} y todo nuestro equipo.
                            </p>

                        </td>
                    </tr>

                    <!-- SEPARADOR CORPORATIVO -->

                    <tr>
                        <td style="
                            height:5px;
                            background-color:#16a34a;
                        ">
                        </td>
                    </tr>

                    <!-- PIE DE CORREO -->

                    <tr>
                        <td
                            align="center"
                            style="
                                padding:24px 18px;
                                background-color:#082e50;
                                color:#ffffff;
                            "
                        >
                            <p style="
                                margin:0 0 10px;
                                font-size:15px;
                                font-weight:bold;
                            ">
                                {{EMPRESA}}
                            </p>

                            <p style="
                                margin:0 0 10px;
                                font-size:12px;
                                color:#d5e9f4;
                            ">
                                Bienestar y Gestión Humana
                            </p>

                            <p style="
                                margin:0 0 10px;
                                font-size:12px;
                                color:#d5e9f4;
                            ">
                                {{FECHA}}
                            </p>

                            <p style="
                                margin:16px 0 0;
                                font-size:11px;
                                line-height:1.6;
                                color:#b7ccda;
                            ">
                                Este mensaje ha sido generado
                                automáticamente por el sistema
                                de gestión corporativa.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
