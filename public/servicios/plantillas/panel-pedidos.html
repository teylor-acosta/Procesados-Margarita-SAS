<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos · Procesados Margarita</title>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Averia Libre', sans-serif;
            background: linear-gradient(135deg, #f0f6ff, #eafaf1);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .contenedor { max-width: 900px; margin: 0 auto; }
        h1 { color: #071a33; margin-bottom: 20px; }
        .pedido {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #155eef;
        }
        .pedido h3 { color: #0b2345; margin-bottom: 10px; }
        .pedido p { color: #475569; font-size: 14px; margin-bottom: 5px; }
        .acciones { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .btn-ok { background: #12c76a; color: white; }
        .btn-no { background: #dc2626; color: white; }
        .btn:hover { opacity: 0.9; }
        .motivo-input {
            padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;
            width: 100%; margin-top: 10px; font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>📋 Panel de Pedidos</h1>
        <p style="color:#64748b; margin-bottom:30px;">Aquí puedes confirmar o rechazar los pedidos recibidos.</p>
        <div id="lista-pedidos"></div>
    </div>

    <script>
        // ⚠️ Pedidos de ejemplo (en un sistema real, los leerías de la base de datos)
        const pedidosEjemplo = [
            {
                numero: 'PM-000001',
                cliente: 'María López',
                correo: 'cliente@ejemplo.com',
                telefono: '3001112233',
                productos: [
                    { nombre: 'Gancho Negro', cantidad: 250, precio: 200, total: 50000, tipo: 'producto' },
                    { nombre: 'Material Ejemplo 1', cantidad: 50, precio: 0, total: 0, tipo: 'material' }
                ],
                subtotal: 50000,
                total: 50000
            }
        ];

        const contenedor = document.getElementById('lista-pedidos');

        pedidosEjemplo.forEach(pedido => {
            const div = document.createElement('div');
            div.className = 'pedido';
            div.innerHTML = `
                <h3>Pedido #${pedido.numero} — ${pedido.cliente}</h3>
                <p><strong>Correo:</strong> ${pedido.correo}</p>
                <p><strong>Teléfono:</strong> ${pedido.telefono}</p>
                <p><strong>Total:</strong> $${pedido.total.toLocaleString('es-CO')}</p>
                <input type="text" class="motivo-input" placeholder="Motivo del rechazo (solo si vas a rechazar)" data-numero="${pedido.numero}">
                <div class="acciones">
                    <button class="btn btn-ok" data-accion="confirmar" data-numero="${pedido.numero}">✅ Confirmar</button>
                    <button class="btn btn-no" data-accion="rechazar" data-numero="${pedido.numero}">❌ Rechazar</button>
                </div>
            `;
            contenedor.appendChild(div);
        });

        // Manejar los botones
        contenedor.addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;

            const accion = btn.dataset.accion;
            const numero = btn.dataset.numero;
            const pedido = pedidosEjemplo.find(p => p.numero === numero);
            if (!pedido) return;

            if (accion === 'confirmar') {
                const res = await fetch(`/api/pedidos/${numero}/confirmar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pedido)
                });
                const data = await res.json();
                alert(data.mensaje);
            }

            if (accion === 'rechazar') {
                const motivoInput = document.querySelector(`input[data-numero="${numero}"]`);
                const motivo = motivoInput.value.trim() || 'No especificado';
                
                const res = await fetch(`/api/pedidos/${numero}/rechazar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ motivo, pedido })
                });
                const data = await res.json();
                alert(data.mensaje);
            }
        });
    </script>
</body>
</html>
