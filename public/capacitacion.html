<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Capacitación</title>

    <!-- FUENTE INSTITUCIONAL -->
<link
    href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
    rel="stylesheet"
>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Estilos generales -->
    <link
        rel="stylesheet"
        href="/css/style1.css"
    >

    <!-- Estilos de la capacitación -->
    <link
        rel="stylesheet"
        href="/css/capacitacion.css"
    >

    <link
        rel="stylesheet"
        href="/css/sidebar.css"
    >

</head>

<body data-pagina="capacitacion">

    <!-- ==========================================
         SIDEBAR
    =========================================== -->

    <div id="sidebarContainer"></div>

    <!-- OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>


    <!-- =========================================
         NAVBAR
    ========================================= -->

    <nav class="navbar-custom">

        <div class="navbar-left">

            <i
                class="fas fa-bars menu-toggle"
                id="btnOpenSidebar">
            </i>

            <span class="section-main-title">
                Capacitación
            </span>

        </div>

    </nav>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main class="contenido-capacitacion">

    <!-- VOLVER -->
    <div class="volver-capacitaciones">

        <button
            type="button"
            onclick="window.location.href='/mis-capacitaciones'"
        >

            <i class="fas fa-arrow-left"></i>

            Volver a mis capacitaciones

        </button>

    </div>


    <!-- ==========================================
     ENCABEZADO DE LA CAPACITACIÓN
=========================================== -->

<header class="encabezado-capacitacion">

    <div class="info-capacitacion">

        <span class="etiqueta-capacitacion">

            <i class="fas fa-graduation-cap"></i>

            Capacitación

        </span>

        <h1 id="tituloCurso">
            Cargando capacitación...
        </h1>

        <p id="descripcionCurso">
            Preparando el contenido de la capacitación.
        </p>

    </div>


    <!-- PROGRESO -->

    <div class="progreso-general">

        <div class="progreso-texto">

            <span>Progreso</span>

            <strong id="porcentajeProgreso">
                0%
            </strong>

        </div>

        <div class="progress">

            <div
                id="barraProgreso"
                class="progress-bar"
                role="progressbar"
                style="width:0%"
            ></div>

        </div>

    </div>

</header>



        <!-- ======================================
             CUERPO
        ======================================= -->

        <section class="contenedor-curso">


            <!-- ==================================
                 COLUMNA CAPÍTULOS
            =================================== -->

            <aside class="lista-capitulos">

                <div class="titulo-lista">

                    <h3>

                        <i class="fas fa-list"></i>

                        Contenido

                    </h3>

                </div>


                <div id="contenedorCapitulos">

                    <div class="cargando">

                        <i class="fas fa-spinner fa-spin"></i>

                        Cargando capítulos...

                    </div>

                </div>

            </aside>



            <!-- ==================================
                 CONTENIDO DEL CAPÍTULO
            =================================== -->

            <section class="contenido-actual">


                <!-- INFORMACIÓN DEL CAPÍTULO -->

                <div
                    id="informacionCapitulo"
                    class="bloque-capitulo"
                >

                    <div class="estado-inicial">

                        <i class="fas fa-book-open"></i>

                        <h2>

                            Selecciona un capítulo

                        </h2>

                        <p>

                            Selecciona un capítulo del menú
                            para comenzar la capacitación.

                        </p>

                    </div>

                </div>



                <!-- ==================================
                     VIDEOS / SUBCAPÍTULOS
                =================================== -->

                <div
                    id="contenedorContenido"
                    class="contenido-subcapitulos"
                >

                </div>



                <!-- ==================================
                     MATERIAL DE APOYO
                =================================== -->

                <div
                    id="contenedorMaterial"
                    class="material-apoyo d-none"
                >

                    <div class="titulo-seccion">

                        <i class="fas fa-folder-open"></i>

                        <h3>

                            Material de apoyo

                        </h3>

                    </div>

                    <div id="listaMaterial">

                    </div>

                </div>



                <!-- ==================================
                     EVALUACIÓN
                =================================== -->

                <div
                    id="contenedorEvaluacion"
                    class="evaluacion-capitulo d-none"
                >

                    <div class="titulo-seccion">

                        <i class="fas fa-clipboard-check"></i>

                        <h3>

                            Evaluación

                        </h3>

                    </div>

                    <div id="informacionEvaluacion">

                    </div>

                </div>



                <!-- ==================================
                     NAVEGACIÓN
                =================================== -->

                <div class="navegacion-capitulo">

                    <button
                        id="btnAnterior"
                        class="btn btn-outline-secondary"
                        disabled
                    >

                        <i class="fas fa-arrow-left"></i>

                        Anterior

                    </button>


                    <button
                        id="btnSiguiente"
                        class="btn btn-success"
                    >

                        Siguiente

                        <i class="fas fa-arrow-right"></i>

                    </button>

                </div>


            </section>

        </section>

    </main>



    <!-- ==========================================
         BOOTSTRAP
    =========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


<script src="https://www.youtube.com/iframe_api"></script>


    <!-- ==========================================
         SIDEBAR
    =========================================== -->

    <script src="/js/sidebar.js"></script>


    <!-- ==========================================
         CAPACITACIÓN
    =========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/capacitacion.js"></script>


</body>

</html>
