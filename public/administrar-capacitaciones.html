<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>

    Administrar Capacitaciones

</title>

<link
    href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    rel="stylesheet"
    href="/css/style1.css"
>

<link
    rel="stylesheet"
    href="/css/sidebar.css"
>

<link
    rel="stylesheet"
    href="/css/administrar-capacitaciones.css"
>

<link
    rel="icon"
    href="/img/Gemini_Generated_Image_bo9w5fbo9w5fbo9w-removebg-preview.png"
>

</head>

<body data-pagina="administrar-capacitaciones">

<!-- ========================================= -->
<!-- SIDEBAR                                   -->
<!-- ========================================= -->

<div id="sidebarContainer"></div>

<div
    class="sidebar-overlay"
    id="sidebarOverlay">
</div>

<!-- ========================================= -->
<!-- NAVBAR                                    -->
<!-- ========================================= -->

<nav class="navbar-custom">

    <div class="navbar-left">

        <i
            class="fas fa-bars menu-toggle"
            id="btnOpenSidebar">
        </i>

        <span class="empresa-nombre">

            Administrar Capacitaciones

        </span>

    </div>

</nav>

<!-- ========================================= -->
<!-- CONTENIDO -->
<!-- ========================================= -->

<div class="admin-capacitaciones">

    <!-- CABECERA -->

    <div class="cabecera-admin">

        <h1>

            <i class="fas fa-chalkboard-teacher"></i>

            Administrar Capacitaciones

        </h1>

        <p>

            Crea, organiza y administra todas las capacitaciones disponibles dentro del ERP.

        </p>

    </div>

    <!-- ESTADISTICAS -->

    <div class="estadisticas-grid">

        <div class="stat-card verde">

            <i class="fas fa-book"></i>

            <h2 id="totalCapacitaciones">

                0

            </h2>

            <span>

                Capacitaciones

            </span>

        </div>

        <div class="stat-card azul">

            <i class="fas fa-users"></i>

            <h2 id="totalAsignados">

                0

            </h2>

            <span>

                Empleados Asignados

            </span>

        </div>

        <div class="stat-card naranja">

            <i class="fas fa-circle-play"></i>

            <h2 id="totalActivas">

                0

            </h2>

            <span>

                Activas

            </span>

        </div>

        <div class="stat-card rojo">

            <i class="fas fa-file-circle-check"></i>

            <h2 id="totalFinalizadas">

                0

            </h2>

            <span>

                Finalizadas

            </span>

        </div>

    </div>

    <!-- BARRA SUPERIOR -->

    <div class="barra-superior">

        <div class="lado-izquierdo">

            <input

                type="text"

                id="buscarCapacitacion"

                class="form-control"

                placeholder="Buscar capacitación..."

            >

            <select
                id="filtroEstado"
                class="form-select">

                <option value="">

                    Todas

                </option>

                <option value="ACTIVA">

                    Activas

                </option>

                <option value="BORRADOR">

                    Borradores

                </option>

                <option value="INACTIVA">

                    Inactivas

                </option>

            </select>

        </div>

        <button

            class="btn-nueva"

            id="btnNuevaCapacitacion">

            <i class="fas fa-plus"></i>

            Nueva Capacitación

        </button>

    </div>

    <!-- LISTADO -->

    <div
        class="contenedor-capacitaciones"
        id="contenedorCapacitaciones">

        <!-- Las tarjetas se cargarán desde administrar-capacitaciones.js -->

    </div>

</div>

<!-- ===========================================
MODAL NUEVA CAPACITACIÓN
=========================================== -->

<div
    class="modal fade"
    id="modalNuevaCapacitacion"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="fas fa-graduation-cap"></i>

                    Nueva Capacitación

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Nombre de la capacitación

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="tituloCurso"
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Fecha límite

                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="fechaLimite"
                        >

                    </div>

                    <div class="col-12 mb-3">

                        <label class="form-label">

                            Descripción

                        </label>

                        <textarea
                            class="form-control"
                            id="descripcionCurso"
                            rows="4"
                        ></textarea>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Imagen

                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="imagenCurso"
                            accept="image/*"
                        >

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Estado

                        </label>

                        <select
                            class="form-select"
                            id="estadoCurso"
                        >

                            <option value="ACTIVO">

                                Activo

                            </option>

                            <option value="INACTIVO">

                                Inactivo

                            </option>

                        </select>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Obligatorio

                        </label>

                        <select
                            class="form-select"
                            id="obligatorioCurso"
                        >

                            <option value="1">

                                Sí

                            </option>

                            <option value="0">

                                No

                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >

                    Cancelar

                </button>

                <button
                    class="btn btn-success"
                    id="btnGuardarCurso"
                >

                    <i class="fas fa-save"></i>

                    Guardar Capacitación

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="/js/sidebar.js"></script>

<script src="/js/administrar-capacitaciones.js"></script>

</body>

</html>
