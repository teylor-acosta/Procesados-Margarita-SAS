<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar Sesión - Procesados Margarita</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="manifest" href="/manifest.json">

    <meta name="theme-color" content="#198754">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="/css/style1.css">

    <link rel="stylesheet" href="/css/login.css">

    <style>
        .btn-margarita-login {
            background: linear-gradient(135deg, #02412e 0%, #036245 100%) !important;
            border: none !important;
            color: #ffffff !important;
            font-family: 'Averia Libre', sans-serif;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(2, 65, 46, 0.15);
            transition: all 0.2s ease-in-out;
        }

        .btn-margarita-login:hover {
            background: linear-gradient(135deg, #036245 0%, #04835c 100%) !important;
            box-shadow: 0 6px 12px rgba(2, 65, 46, 0.25);
            transform: translateY(-1px);
        }

        .btn-margarita-login:active {
            transform: translateY(1px);
        }
        
        /* Ajuste sutil para los enlaces de texto principal si es necesario */
        .text-primary {
            color: #036245 !important;
        }
    </style>

    <link
        rel="icon"
        href="/img/Gemini_Generated_Image_bo9w5fbo9w5fbo9w-removebg-preview.png"
    >

</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="card-custom fade-in">

                    <div class="card-header-custom text-center">

                        <img
                            src="/img/logo de procesados sin NIT.png"
                            width="100"
                            class="mb-3"
                            loading="lazy"
                        >

                        <h3>Iniciar Sesión</h3>

                        <p class="mb-0 fw-bold" style="color: #02412e; font-family: 'Averia Libre';">
                            Sistema ERP Procesados Margarita
                        </p>

                    </div>

                    <div class="card-body-custom">

                        <form id="loginForm">

                            <div class="mb-3">

                                <label class="form-label fw-semibold" style="color: #023324;">
                                    Usuario
                                </label>

                                <input
                                    type="text"
                                    name="usuario"
                                    class="form-control"
                                    placeholder="Ingrese su usuario"
                                    required
                                    autocomplete="username"
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-semibold" style="color: #023324;">
                                    Contraseña
                                </label>

                                <div class="input-password">

                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        class="form-control"
                                        placeholder="Ingrese su contraseña"
                                        required
                                        autocomplete="current-password"
                                    >

                                    <i
                                        class="fas fa-eye toggle-password"
                                        id="togglePassword"
                                    ></i>

                                </div>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-margarita-login w-100 mt-2 d-flex align-items-center justify-content-center gap-2"
                            >
                                <i class="fas fa-sign-in-alt"></i>
                                Ingresar
                            </button>

                            <hr class="my-4">

                            <div class="text-center">

                                <a
                                    href="/recuperar"
                                    class="text-decoration-none fw-bold"
                                    style="color: #036245; font-size: 0.95rem;"
                                >

                                    <i class="fas fa-key me-1"></i>

                                    ¿Olvidaste tu contraseña?

                                </a>

                            </div>

                        </form>

                        <div id="mensaje" style="display:none;"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="/js/auth.js"></script>

    <script src="/js/login.js"></script>
</body>

</html>
