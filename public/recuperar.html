<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recuperar Contraseña - Procesados Margarita
    </title>

    <!-- FUENTE -->
    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap"
        rel="stylesheet"
    >

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ICONOS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- ICONO -->
    <link
        rel="icon"
        href="img/Gemini_Generated_Image_bo9w5fbo9w5fbo9w-removebg-preview.png"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style1.css"
    >

    <link
        rel="stylesheet"
        href="css/recuperar.css"
    >

</head>

<body class="recuperar-body">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-5">

            <div class="card-recuperar">

                <!-- LOGO -->
                <div class="text-center">

                    <img
                        src="/img/Logo.png"
                        alt="Logo"
                        class="logo-recuperar"
                    >

                    <h3>
                        Recuperar acceso
                    </h3>

                    <p class="subtexto-recuperar">

                        Ingresa tu documento para
                        enviar un enlace seguro
                        de recuperación.

                    </p>

                </div>

                <!-- FORM -->
                <form id="recuperarForm">

                    <div class="mb-4">

                        <label class="form-label">

                            Número de documento

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="fas fa-id-card"></i>

                            </span>

                            <input
                                type="text"
                                id="documento"
                                name="documento"
                                class="form-control"
                                placeholder="Ingrese su documento"
                                required
                            >

                        </div>

                    </div>

                    <!-- BOTON -->
                    <button
                        type="submit"
                        id="btnRecuperar"
                        class="btn-recuperar"
                    >

                        <i class="fas fa-paper-plane me-2"></i>

                        Enviar enlace

                    </button>

                    <!-- MENSAJE -->
                    <div
                        id="mensaje"
                        class="mensaje-recuperar"
                        style="display:none;"
                    ></div>

                    <hr class="my-4">

                    <!-- LOGIN -->
                    <div class="text-center">

                        <a
                            href="/login"
                            class="volver-login"
                        >

                            <i class="fas fa-arrow-left me-1"></i>

                            Regresar al login

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- SWEET ALERT -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- JS -->
<script src="js/recuperar.js"></script>

</body>
</html>
