<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    
    <!-- SEO y Seguridad -->
    <meta name="description" content="Panel de módulos del ERP de Procesados Margarita S.A.S.">
    <meta name="robots" content="noindex, nofollow"> <!-- Evita indexación en buscadores (es privado) -->
    <meta name="theme-color" content="#0b2345">

    <title>Panel de Módulos - Procesados Margarita</title>

    <!-- OPTIMIZACIÓN DE FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="img/Gemini_Generated_Image_bo9w5fbo9w5fbo9w-removebg-preview.png">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="css/style1.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/panel.css">

    <!-- Prevenir FOUC (Flashes of unstyled content) -->
    <style>
        body { background-color: #f4f7f6; margin: 0; }
    </style>
</head>

<body data-pagina="panel">

    <!-- SIDEBAR DINÁMICO -->
    <div id="sidebarContainer"></div>

    <!-- OVERLAY PARA MÓVILES -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- NAVBAR -->
    <nav class="navbar-custom" role="navigation" aria-label="Barra de navegación principal">
        <div class="navbar-left">
            <i class="fas fa-bars menu-toggle" id="btnOpenSidebar" role="button" tabindex="0" aria-label="Abrir menú lateral"></i>
            <span class="empresa-nombre">Panel de Módulos</span>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="panel-container">

        <!-- BIENVENIDA -->
        <header class="bienvenida-panel">
            <h1>ERP Procesados Margarita</h1>
            <p>Selecciona un módulo para continuar.</p>
        </header>

        <!-- TÍTULO DE LA SECCIÓN -->
        <div class="titulo-panel">
            <h2>Módulos disponibles</h2>
        </div>

        <!-- CONTENEDOR DINÁMICO (Se llena con panel.js) -->
        <div id="contenedorModulos" class="modulos-container" aria-live="polite"></div>

    </main>

    <!-- SCRIPTS -->
    <script src="/js/auth.js"></script>
    <script src="js/panel.js"></script>
    <script src="/js/sidebar.js"></script>

</body>
</html>
