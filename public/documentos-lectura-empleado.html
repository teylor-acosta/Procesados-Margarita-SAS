
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lectura de documentos | Procesados Margarita</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/documentos-lectura-empleado.css">
</head>

<body>

    <header class="encabezado-documentos">

        <div class="encabezado-logo">
            <img src="img/logo.png" alt="Procesados Margarita">
        </div>

        <div class="encabezado-titulo">
            <h1>Lectura de documentos obligatorios</h1>
            <p>Procesados Margarita S.A.S.</p>
        </div>

    </header>

    <main class="contenedor-documentos">

        <section class="introduccion">
            <h2>Documentación empresarial</h2>

            <p>
                Para continuar al sistema ERP, debes consultar y aceptar
                todos los documentos vigentes de la empresa.
            </p>
        </section>

        <section id="resumen-documentos" class="resumen">
            <span id="contador-documentos">Cargando documentos...</span>
        </section>

        <section id="lista-documentos" class="lista-documentos">
            <!-- Documentos cargados dinámicamente -->
        </section>

        <section id="mensaje-final" class="mensaje-final" hidden>
            <h2>¡Proceso completado!</h2>

            <p>
                Has leído y aceptado todos los documentos obligatorios.
            </p>

            <button id="btn-continuar" class="btn-continuar">
                Continuar al ERP
            </button>
        </section>

    </main>

    <script src="js/documentos-lectura-empleado.js"></script>

</body>
</html>
